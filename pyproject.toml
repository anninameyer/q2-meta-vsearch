[project]
name = "q2-meta-vsearch"
authors = [
    { name = "Greg Caporaso", email = "gregcaporaso@gmail.com" }
]
description = "QIIME 2 plugin for exhaustive reference alignment and conventional VSEARCH clustering."
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
dynamic = ["version"]

[project.urls]
Homepage = "https://qiime2.org"
Repository = "https://github.com/anninameyer/q2-meta-vsearch"

[project.entry-points.'qiime2.plugins']
"q2-meta-vsearch" = "q2_meta_vsearch.plugin_setup:plugin"

[build-system]
requires = [
    "setuptools",
    "versioningit",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.versioningit.vcs]
method = "git-archive"
describe-subst = "$Format:%(describe)$"
default-tag = "0.0.1"

[tool.versioningit.next-version]
method = "minor"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.write]
file = "q2_meta_vsearch/_version.py"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["q2_meta_vsearch*"]

[tool.setuptools.package-data]
q2_meta_vsearch = ["**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "*.pyc"]
